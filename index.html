<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B6FAE">
  <title>Dr HERKAT Ahmed | Chirurgien Dentiste</title>
  <style>
    :root {
      --blue: #0B6FAE;
      --blue-dark: #075783;
      --blue-light: #EAF6FC;
      --text: #173042;
      --muted: #6B7C88;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: linear-gradient(145deg, #f8fcfe 0%, #ffffff 55%, #eef8fd 100%);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .page {
      width: 100%;
      max-width: 430px;
      position: relative;
      overflow: hidden;
    }

    .card {
      position: relative;
      background: rgba(255,255,255,.96);
      border: 1px solid #e2eef4;
      border-radius: 28px;
      padding: 30px 22px 24px;
      box-shadow: 0 18px 50px rgba(20, 90, 125, .12);
      text-align: center;
    }

    .watermark {
      position: absolute;
      width: 210px;
      height: 210px;
      border: 18px solid rgba(11,111,174,.035);
      border-radius: 55% 55% 45% 45%;
      transform: rotate(12deg);
      right: -110px;
      top: 75px;
      pointer-events: none;
    }

    .logo-wrap {
      width: 110px;
      height: 110px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .logo-placeholder {
      width: 90px;
      height: 90px;
      border: 3px solid var(--blue);
      border-radius: 55% 55% 48% 48%;
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 25px;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      letter-spacing: .3px;
      color: var(--blue-dark);
    }

    .profession {
      margin: 7px 0 4px;
      font-size: 14px;
      font-weight: 600;
      color: var(--blue);
    }

    .slogan {
      margin: 0 0 23px;
      color: var(--muted);
      font-size: 14px;
      font-style: italic;
    }

    .address {
      margin: 0 auto 20px;
      max-width: 330px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
    }

    .buttons {
      display: grid;
      gap: 11px;
      position: relative;
      z-index: 1;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      min-height: 52px;
      padding: 13px 18px;
      border-radius: 15px;
      text-decoration: none;
      border: 1px solid #dbeaf2;
      background: var(--white);
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      transition: transform .15s ease, box-shadow .15s ease;
      cursor: pointer;
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 7px 20px rgba(11,111,174,.10);
    }

    .button.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: white;
    }

    .icon {
      width: 23px;
      text-align: center;
      font-size: 19px;
    }

    .footer {
      margin-top: 22px;
      font-size: 10px;
      color: #9aaab4;
      letter-spacing: .4px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translate(-50%, 20px);
      opacity: 0;
      background: #173042;
      color: white;
      padding: 11px 16px;
      border-radius: 12px;
      font-size: 13px;
      pointer-events: none;
      transition: .25s ease;
      z-index: 20;
    }

    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <div class="watermark"></div>

      <!--
        Pour utiliser le logo du cabinet :
        place le fichier logo.png dans le même dossier que index.html
        puis décommente la ligne <img> ci-dessous.
      -->
      <div class="logo-wrap">
        <img src="logo.png" alt="Logo Dr HERKAT Ahmed"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="logo-placeholder" style="display:none;">H</div>
      </div>

      <h1>Dr HERKAT Ahmed</h1>
      <div class="profession">Chirurgien Dentiste</div>
      <div class="slogan">Votre sourire, notre priorité</div>

      <p class="address">
        Cité Farachati, en face de l’Académie – Bouira
      </p>

      <div class="buttons">
        <a class="button primary" href="tel:+213784848401">
          <span class="icon">☎</span>
          <span>Appeler le cabinet</span>
        </a>

        <a class="button" href="https://maps.app.goo.gl/7uw2QRDy9ucth2Zp8?g_st=ic"
           target="_blank" rel="noopener">
          <span class="icon">📍</span>
          <span>Itinéraire vers le cabinet</span>
        </a>

        <a class="button" href="https://www.instagram.com/dr.herkat?utm_source=ig_web_button_share_sheet&stkn=ZDNlZDc0MzIxNw=="
           target="_blank" rel="noopener">
          <span class="icon">◎</span>
          <span>Instagram</span>
        </a>

        <a class="button" href="https://www.facebook.com/860364593820310?ref=PROFILE_EDIT_xav_ig_profile_page_web"
           target="_blank" rel="noopener">
          <span class="icon">f</span>
          <span>Facebook</span>
        </a>

        <button class="button" type="button" onclick="addContact()">
          <span class="icon">＋</span>
          <span>Ajouter aux contacts</span>
        </button>
      </div>

      <div class="footer">THRONE OF SMILE</div>
    </section>
  </main>

  <div id="toast" class="toast">Contact prêt à être enregistré.</div>

  <script>
    function addContact() {
      const vcard =
`BEGIN:VCARD
VERSION:3.0
N:HERKAT;Ahmed;;Dr;
FN:Dr HERKAT Ahmed
ORG:THRONE OF SMILE
TITLE:Chirurgien Dentiste
TEL;TYPE=CELL:+213784848401
ADR;TYPE=WORK:;;Cité Farachati, en face de l’Académie;Bouira;;;Algérie
URL:https://maps.app.goo.gl/7uw2QRDy9ucth2Zp8?g_st=ic
URL;TYPE=Instagram:https://www.instagram.com/dr.herkat
URL;TYPE=Facebook:https://www.facebook.com/860364593820310
NOTE:Votre sourire, notre priorité
END:VCARD`;

      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "Dr-HERKAT-Ahmed.vcf";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);

      const toast = document.getElementById("toast");
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2500);
    }
  </script>
</body>
</html>
